; DefaultScalability.ini - Snack Ops v2 (Iron Will Interactive)
; Presets: 0 = Low, 1 = Medium, 2 = High, 3 = Epic (default), 4 = Cinematic
; Tuned to hold a clean, grounded Lumen look on an RTX 3060 12GB.
; Cinematic is the only preset that can drop below 60 FPS on a 3060 at 1440p.

[ScalabilitySettings]
ResolutionQuality=100.000000
ViewDistanceQuality=3
AntiAliasingQuality=3
ShadowQuality=3
